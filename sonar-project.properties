# scan templates in cdk.out even though they are in .gitignore
sonar.scm.exclusions.disabled = true

sonar.sources = source/,simtest/

sonar.exclusions = \
    **/test/**/*, \
    **/__tests__/**/*, \
    test-stack/**/*, \
    **/jest.config.*, \
    source/**/*.test.ts, \
    **/coverage/**/*, \
    source/**/cdk.out/*, \
    source/pre_processor/coverage/**/*, \
    deployment/utils/coverage/**/*, \
    source/webui/src/__tests__/**, \
    source/webui/src/public/*, \
    source/data-models/cjs/**, \
    source/data-models/esm/**, \
    **/node_modules/**, \
    loadtests/**/*, \
    **/*.java

sonar.tests = \
    source/layer/test/,  \
    source/Orchestrator/test/, \
    source/playbooks/AFSBP/test/, \
    source/playbooks/AFSBP/ssmdocs/scripts/test/, \
    source/playbooks/CIS120/test/, \
    source/playbooks/CIS140/test/, \
    source/playbooks/common/test/, \
    source/playbooks/NEWPLAYBOOK/test/, \
    source/playbooks/NIST80053/test/, \
    source/playbooks/PCI321/test/, \
    source/playbooks/PCI321/ssmdocs/scripts/test/, \
    source/playbooks/SC/test/, \
    source/remediation_runbooks/scripts/test/, \
    source/solution_deploy/source/test/, \
    source/test/, \
    source/lambdas/pre-processor/__tests__/, \
    source/lambdas/api/__tests__/, \
    source/lambdas/common/__tests__/, \
    source/lambdas/synchronization/__tests__/, \
    source/lambdas/notification-channels/__tests__/, \
    source/lambdas/notification-dispatcher/__tests__/, \
    source/lambdas/batch-processor/__tests__/, \
    source/lambdas/iac-template-sync/__tests__/, \
    source/lambdas/baseline-configuration/__tests__/, \
    source/lambdas/mcp-server/__tests__/, \
    deployment/utils/, \
    source/webui/src/__tests__/
sonar.coverage.exclusions=\
    simtest/**/*, \
    source/webui/public/mockServiceWorker.js, \
    source/webui/src/mocks/**, \
    source/webui/src/main.tsx, \
    source/webui/src/setupTests.ts, \
    source/data-models/**
sonar.python.version = 3.11
sonar.python.coverage.reportPaths = deployment/test/coverage-reports/*.coverage.xml

sonar.javascript.lcov.reportPaths = \
    source/coverage/lcov.info, \
    source/webui/coverage/lcov.info, \
    source/lambdas/api/coverage/lcov.info, \
    source/lambdas/common/coverage/lcov.info, \
    source/lambdas/pre-processor/coverage/lcov.info, \
    source/lambdas/synchronization/coverage/lcov.info, \
    source/lambdas/notification-channels/coverage/lcov.info, \
    source/lambdas/notification-dispatcher/coverage/lcov.info, \
    source/lambdas/batch-processor/coverage/lcov.info, \
    source/lambdas/mcp-server/coverage/lcov.info

sonar.cpd.exclusions= \
    source/lib/administrator-stack.ts, \
    source/playbooks/**/lib/*_remediations.ts, \
    source/playbooks/**/lib/*construct.ts, \
    source/playbooks/**/ssmdocs/**, \
    source/lib/*-stack.ts, \
    source/remediation_runbooks/scripts/*_rollback.py

sonar.issue.ignore.multicriteria = ts1,ts2,py1,py2,py3
sonar.issue.ignore.multicriteria.ts1.ruleKey = typescript:S1848
sonar.issue.ignore.multicriteria.ts1.resourceKey = **/*.ts

# S6270 flags the AnyPrincipal() in the IaC-templates bucket resource policy as
# granting public access. It is not: both statements are scoped by a
# StringEquals condition on aws:PrincipalAccount = the stack account, so only
# principals in the solution's own account are granted. The bucket itself is
# BlockPublicAccess.BLOCK_ALL with publicReadAccess: false. The analyzer matches
# on the AnyPrincipal and cannot see the account-scoping condition.
sonar.issue.ignore.multicriteria.ts2.ruleKey = typescript:S6270
sonar.issue.ignore.multicriteria.ts2.resourceKey = source/lib/admin/iac-templates-bucket.ts

# S6243 wants AWS clients initialized outside the handler so they are reused
# across warm invocations. migration_auto_remediation_provider.py already does
# this — the SNS client is cached in a module-global and reused — but it is
# created lazily inside an accessor (so the client binds after moto mocking /
# runtime credentials are in place), which the analyzer cannot distinguish from
# per-invocation creation. Same established pattern as action_target_provider.py.
sonar.issue.ignore.multicriteria.py1.ruleKey = python:S6243
sonar.issue.ignore.multicriteria.py1.resourceKey = source/solution_deploy/source/migration_auto_remediation_provider.py

# S1313 flags "hardcoded IP addresses" in the Inspector vulnerability test, but
# the flagged strings are SSM Agent version numbers (e.g. _compare_versions(
# actual="3.0.0.0", ...), AgentVersion "3.2.1.0"), not IPs. Dotted version
# strings are indistinguishable from IPv4 to the analyzer.
sonar.issue.ignore.multicriteria.py2.ruleKey = python:S1313
sonar.issue.ignore.multicriteria.py2.resourceKey = source/playbooks/SC/ssmdocs/scripts/tests/test_SC_Inspector_InstanceVulnerability.py

# S1313 flags "hardcoded IP addresses" in the migration provider, but the
# flagged strings are CIS benchmark control IDs used as mapping keys (e.g.
# "2.1.5.1": "S3.1"), not IPs. Dotted CIS IDs look like IPv4 to the analyzer.
sonar.issue.ignore.multicriteria.py3.ruleKey = python:S1313
sonar.issue.ignore.multicriteria.py3.resourceKey = source/solution_deploy/source/migration_auto_remediation_provider.py
