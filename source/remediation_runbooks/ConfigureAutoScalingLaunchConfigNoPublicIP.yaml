---
schemaVersion: '0.3'
description: |
  ### Document name - ASR-ConfigureAutoScalingLaunchConfigNoPublicIP

  ## What does this document do?
    This document migrates the Auto Scaling group to a Launch Template that does not assign a public IP address.
    Auto Scaling groups still backed by a Launch Configuration are migrated to a Launch Template as part of the remediation.
    The original non-compliant launch configuration is deleted once no Auto Scaling group still references it.

  ## Input Parameters
  * AutomationAssumeRole: (Required) The ARN of the role that allows Automation to perform the actions on your behalf.
  * AutoScalingResourceId: (Required) The name of the Auto Scaling group or launch configuration from the finding.

  ## Output Parameters
  * Remediation.Output - the per-Auto-Scaling-group remediation results

  ## Security Standards / Controls
  * NIST 800-53 Rev5: Autoscaling.5

assumeRole: '{{ AutomationAssumeRole }}'
parameters:
  AutomationAssumeRole:
    type: String
    description: (Required) The ARN of the role that allows Automation to perform the actions on your behalf.
    allowedPattern: '^arn:(?:aws|aws-us-gov|aws-cn):iam::\d{12}:role/[\w+=,.@-]+$'
  AutoScalingResourceId:
    type: String
    description: (Required) The name of the Auto Scaling group or launch configuration from the finding.
    allowedPattern: '^.{1,255}$'
outputs:
  - Remediation.Output
mainSteps:
  - name: 'ResolveTarget'
    action: 'aws:executeScript'
    timeoutSeconds: 600
    isEnd: false
    inputs:
      Runtime: 'python3.11'
      Handler: 'resolve_auto_scaling_group_launch_source'
      InputPayload:
        AutoScalingResourceId: '{{AutoScalingResourceId}}'
      Script: |-
        %%SCRIPT=ResolveAutoScalingGroupLaunchSource.py%%
    outputs:
      - Name: Context
        Selector: '$.Payload'
        Type: 'StringMap'
  - name: 'BuildLaunchTemplateData'
    action: 'aws:executeScript'
    isEnd: false
    inputs:
      Runtime: 'python3.11'
      Handler: 'set_launch_template_data_disable_public_ip'
      InputPayload:
        Context: '{{ResolveTarget.Context}}'
      Script: |-
        %%SCRIPT=SetLaunchTemplateDataDisablePublicIp.py%%
    outputs:
      - Name: Context
        Selector: '$.Payload'
        Type: 'StringMap'
  - name: 'Remediation'
    action: 'aws:executeScript'
    timeoutSeconds: 600
    isEnd: true
    inputs:
      Runtime: 'python3.11'
      Handler: 'apply_launch_template_to_auto_scaling_group'
      InputPayload:
        Context: '{{BuildLaunchTemplateData.Context}}'
        ControlProperty: no_public_ip
      Script: |-
        %%SCRIPT=ApplyLaunchTemplateToAutoScalingGroup.py%%
    outputs:
      - Name: Output
        Selector: '$.Payload.response'
        Type: 'StringMap'
