---
description: |
  ### Document Name - ASR-ReplaceCodeBuildClearTextCredentials

  ## What does this document do?
  This document is used to replace environment variables containing clear text credentials in a CodeBuild project with Amazon EC2 Systems Manager Parameters.

  ## Input Parameters
  * ProjectName: (Required) Name of the CodeBuild project (not the ARN).
  * AutomationAssumeRole: (Required) The ARN of the role that allows Automation to perform the actions on your behalf.

  ## Output Parameters
  * ReplaceCredentials.ParameterNames - names of the Systems Manager parameters holding the credentials
  * ReplaceCredentials.Policy - result of the API call to create an IAM policy for the project to access the new parameters
  * ReplaceCredentials.AttachResponse - result of the API call to attach the new IAM policy to the project service role
  * ReplaceCredentials.TaggingResult - result of tagging the new Systems Manager parameters
schemaVersion: '0.3'
assumeRole: '{{ AutomationAssumeRole }}'
outputs:
  - ReplaceCredentials.ParameterNames
  - ReplaceCredentials.Policy
  - ReplaceCredentials.AttachResponse
  - ReplaceCredentials.TaggingResult
  - TagPolicy.Output
parameters:
  ProjectName:
    type: String
    description: (Required) The project name (not the ARN).
    allowedPattern: ^[A-Za-z0-9][A-Za-z0-9\-_]{1,254}$
  AutomationAssumeRole:
    type: String
    description: (Required) The ARN of the role that allows Automation to perform the actions on your behalf.
    allowedPattern: '^arn:(?:aws|aws-us-gov|aws-cn):iam::\d{12}:role/[\w+=,.@-]+$'
mainSteps:
  - name: ReplaceCredentials
    action: 'aws:executeScript'
    description: |
      ## ReplaceCredentials
      Reads the build project, copies any clear text credential into a SecureString SSM parameter,
      grants the project service role access to those parameters, and updates the project environment
      to read them from Parameter Store.
    isCritical: true
    timeoutSeconds: 600
    inputs:
      Runtime: python3.11
      Handler: replace_credentials
      InputPayload:
        ProjectName: '{{ ProjectName }}'
      Script: |-
        %%SCRIPT=ReplaceCodeBuildClearTextCredentials.py%%
    outputs:
      - Name: ParameterNames
        Selector: $.Payload.ParameterNames
        Type: StringList
      - Name: Policy
        Selector: $.Payload.Policy
        Type: StringMap
      - Name: AttachResponse
        Selector: $.Payload.AttachResponse
        Type: StringMap
      - Name: ResourceArn
        Selector: $.Payload.ResourceArn
        Type: String
      - Name: TaggingResult
        Selector: $.Payload.TaggingResult
        Type: StringMap
  - name: TagPolicy
    action: aws:executeScript
    onFailure: Continue
    timeoutSeconds: 60
    description: |
      ## TagPolicy

      This step tags the IAM policy with the solution identifier
      ## Outputs
      * Output: Success message or failure exception
    inputs:
      Runtime: python3.11
      Handler: tag_resource
      InputPayload:
        ResourceArn: '{{ReplaceCredentials.ResourceArn}}'
      Script: |-
        %%SCRIPT=common/tag_resource.py%%
    outputs:
      - Name: Output
        Selector: $.Payload
        Type: StringMap
    isEnd: true
