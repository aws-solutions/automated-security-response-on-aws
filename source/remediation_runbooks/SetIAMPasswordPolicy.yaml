---
description: |
  ### Document name - AWSConfigRemediation-SetIAMPasswordPolicy

  ## What does this document do?
  This document sets the AWS Identity and Access Management (IAM) user password policy for the AWS account using the [UpdateAccountPasswordPolicy](https://docs.aws.amazon.com/IAM/latest/APIReference/API_UpdateAccountPasswordPolicy.html) API.

  Every password policy setting is a required parameter. The ASR control runbook for IAM.7 supplies
  all of them on every execution, using the baseline the Security Hub controls require, overridden by
  any custom control parameters configured in Security Hub. Callers must state each value explicitly
  rather than relying on a default that could silently apply a policy the controls still fail.

  ## Input Parameters
  * AllowUsersToChangePassword: (Required) Allows all IAM users in your AWS account to use the AWS Management Console to change their own passwords.
  * HardExpiry: (Required) Prevents IAM users from setting a new password after their password has expired.
  * MaxPasswordAge: (Required) The number of days that an IAM user password is valid. Valid range is 1 to 1095.
  * MinimumPasswordLength: (Required) The minimum number of characters allowed in an IAM user password. Valid range is 6 to 128.
  * PasswordReusePrevention: (Required) Specifies the number of previous passwords that IAM users are prevented from reusing. Valid range is 1 to 24.
  * RequireLowercaseCharacters: (Required) Specifies whether IAM user passwords must contain at least one lowercase character from the ISO basic Latin alphabet (a to z).
  * RequireNumbers: (Required) Specifies whether IAM user passwords must contain at least one numeric character (0 to 9).
  * RequireSymbols: (Required) Specifies whether IAM user passwords must contain at least one of the following non-alphanumeric characters :! @ \# $ % ^ * ( ) _ + - = [ ] { } | '.
  * RequireUppercaseCharacters: (Required) Specifies whether IAM user passwords must contain at least one uppercase character from the ISO basic Latin alphabet (A to Z).
  * AutomationAssumeRole: (Required) The ARN of the role that allows Automation to perform the actions on your behalf.
  ## Output Parameters
  * UpdateIAMUserPasswordPolicy.Output
schemaVersion: "0.3"
assumeRole: "{{ AutomationAssumeRole }}"
parameters:
  AutomationAssumeRole:
    type: String
    description: (Required) The ARN of the role that allows Automation to perform the actions on your behalf.
    allowedPattern: '^arn:(?:aws|aws-us-gov|aws-cn):iam::\d{12}:role/[\w+=,.@-]+$'
  AllowUsersToChangePassword:
    type: Boolean
    description: (Required) Allows all IAM users in your AWS account to use the AWS Management Console to change their own passwords.
  HardExpiry:
    type: Boolean
    description: (Required) Prevents IAM users from setting a new password after their password has expired.
  MaxPasswordAge:
    type: Integer
    description: (Required) The number of days that an IAM user password is valid. Valid range is 1 to 1095.
    allowedPattern: ^[1-9]$|^[1-9]\d$|^[1-9]\d{2}$|^10[0-8]\d$|^109[0-5]$
  MinimumPasswordLength:
    type: Integer
    description: (Required) The minimum number of characters allowed in an IAM user password. Valid range is 6 to 128.
    allowedPattern: ^[6-9]$|^[1-9]\d$|^1[01]\d$|^12[0-8]$
  PasswordReusePrevention:
    type: Integer
    description: (Required) Specifies the number of previous passwords that IAM users are prevented from reusing. Valid range is 1 to 24.
    allowedPattern: ^[1-9]$|^1\d$|^2[0-4]$
  RequireLowercaseCharacters:
    type: Boolean
    description: (Required) Specifies whether IAM user passwords must contain at least one lowercase character from the ISO basic Latin alphabet (a to z).
  RequireNumbers:
    type: Boolean
    description: (Required) Specifies whether IAM user passwords must contain at least one numeric character (0 to 9).
  RequireSymbols:
    type: Boolean
    description: (Required) Specifies whether IAM user passwords must contain at least one of the following non-alphanumeric characters :! @ \# $ % ^ * ( ) _ + - = [ ] { } | '.
  RequireUppercaseCharacters:
    type: Boolean
    description: (Required) Specifies whether IAM user passwords must contain at least one uppercase character from the ISO basic Latin alphabet (A to Z).
outputs:
  - UpdateIAMUserPasswordPolicy.Output
mainSteps:
  - name: UpdateIAMUserPasswordPolicy
    action: "aws:executeScript"
    timeoutSeconds: 600
    isEnd: true
    description: |
      ## UpdateIAMUserPasswordPolicy
      Sets or updates the AWS account password policy using input parameters using UpdateAccountPasswordPolicy API.
      Verify AWS account password policy using GetAccountPasswordPolicy API.
      ## Outputs
      * Output: Success message with HTTP Response from GetAccountPasswordPolicy API call or failure exception.
    inputs:
      Runtime: python3.11
      Handler: set_iam_password_policy
      InputPayload:
        AllowUsersToChangePassword: "{{ AllowUsersToChangePassword }}"
        HardExpiry: "{{ HardExpiry }}"
        MaxPasswordAge: "{{ MaxPasswordAge }}"
        MinimumPasswordLength: "{{ MinimumPasswordLength }}"
        PasswordReusePrevention: "{{ PasswordReusePrevention }}"
        RequireLowercaseCharacters: "{{ RequireLowercaseCharacters }}"
        RequireNumbers: "{{ RequireNumbers }}"
        RequireSymbols: "{{ RequireSymbols }}"
        RequireUppercaseCharacters: "{{ RequireUppercaseCharacters }}"
      Script: |-
        %%SCRIPT=SetIAMPasswordPolicy.py%%
    outputs:
      - Name: Output
        Selector: $.Payload
        Type: StringMap