---
schemaVersion: '0.3'
description: |
  ### Document Name - ASR-CreateIAMSupportRole

  ## What does this document do?
  This document creates a role to allow AWS Support access.

  ## Input Parameters
  * AutomationAssumeRole: (Required) The ARN of the role that allows Automation to perform the actions on your behalf.

  ## Output Parameters
  * CreateIAMRole.Output

assumeRole: '{{ AutomationAssumeRole }}'
parameters:
  AutomationAssumeRole:
    type: String
    description: (Required) The ARN of the role that allows Automation to perform the actions on your behalf.
    allowedPattern: '^arn:(?:aws|aws-us-gov|aws-cn):iam::\d{12}:role/[\w+=,.@-]+$'
outputs:
  - CreateIAMSupportRole.Output
  - TagRole.Output
mainSteps:
  - name: CreateIAMSupportRole
    action: aws:executeScript
    timeoutSeconds: 300
    description: |
      ## CreateIAMSupportRole

      This step creates an IAM role to allow AWS Support access
      ## Outputs
      * Output: Success message or failure Exception.
      * ResourceArn: ARN of the created IAM role
    inputs:
      Runtime: python3.11
      Handler: create_iam_role
      Script: |-
        %%SCRIPT=CreateIAMSupportRole.py%%

    outputs:
      - Name: Output
        Selector: $.Payload
        Type: StringMap
      - Name: ResourceArn
        Selector: $.Payload.ResourceArn
        Type: String

  - name: TagRole
    action: aws:executeScript
    onFailure: Continue
    timeoutSeconds: 60
    description: |
      ## TagRole

      This step tags the IAM role with the solution identifier
      ## Outputs
      * Output: Success message or failure exception
    inputs:
      Runtime: python3.11
      Handler: tag_resource
      InputPayload:
        ResourceArn: '{{CreateIAMSupportRole.ResourceArn}}'
      Script: |-
        %%SCRIPT=common/tag_resource.py%%
    outputs:
      - Name: Output
        Selector: $.Payload
        Type: StringMap
    isEnd: true
