---
description: |
  ### Document Name - ASR-EnableVPCFlowLogs
  ## What does this document do?
  Enables VPC Flow Logs for a given VPC

  ## Input Parameters
  * AutomationAssumeRole: (Required) The ARN of the role that allows Automation to perform the actions on your behalf.
  * VPC: VPC Id of the VPC for which logs are to be enabled
  * RemediationRole: role arn of the role to use for logging
  * KMSKeyArn: Amazon Resource Name (ARN) of the KMS Customer-Managed Key to use to encrypt the log group

  ## Security Standards / Controls
  * AWS FSBP v1.0.0:   CloudTrail.2
  * CIS v1.2.0:     2.7
  * PCI:            CloudTrail.1

schemaVersion: '0.3'
assumeRole: '{{ AutomationAssumeRole }}'
parameters:
  AutomationAssumeRole:
    type: String
    description: (Required) The ARN of the role that allows Automation to perform the actions on your behalf.
    allowedPattern: '^arn:(?:aws|aws-us-gov|aws-cn):iam::\d{12}:role/[\w+=,.@-]+$'
  VPC:
    type: String
    allowedPattern: '^vpc-[0-9a-f]{8,17}$'
    description: The VPC ID of the VPC
  RemediationRole:
    type: String
    description: The ARN of the role that will allow VPC Flow Logs to log to CloudWatch logs
    allowedPattern: '^arn:(?:aws|aws-us-gov|aws-cn):iam::\d{12}:role/[\w+=,.@-]+$'
  KMSKeyArn:
    type: String
    default: >-
      {{ssm:/Solutions/SO0111/CMK_REMEDIATION_ARN}}
    description: The ARN of the KMS key created by ASR for remediations requiring encryption
    allowedPattern: '^arn:(?:aws|aws-us-gov|aws-cn):kms:(?:[a-z]{2}(?:-gov)?-[a-z]+-\d):\d{12}:(?:(?:^(alias/)[a-zA-Z0-9:/_-]+$)|(?:key/(?i:[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12})))$'

outputs:
  - Remediation.Output
  - TagIAMRole.Output
  - TagFlowLog.Output

mainSteps:
  - name: Remediation
    action: 'aws:executeScript'
    outputs:
      - Name: Output
        Selector: $.Payload.Response
        Type: StringMap
      - Name: IamRoleArn
        Selector: $.Payload.IamRoleArn
        Type: String
      - Name: FlowLogArn
        Selector: $.Payload.FlowLogArn
        Type: String
    inputs:
      InputPayload:
        Vpc: '{{VPC}}'
        RemediationRole: '{{RemediationRole}}'
        KmsKeyArn: '{{KMSKeyArn}}'
        Region: '{{global:REGION}}'
        AccountId: '{{global:ACCOUNT_ID}}'
      Runtime: python3.11
      Handler: enable_flow_logs
      Script: |-
        %%SCRIPT=EnableVPCFlowLogs.py%%

  - name: TagIAMRole
    action: 'aws:executeScript'
    onFailure: Continue
    outputs:
      - Name: Output
        Selector: $.Payload
        Type: StringMap
    inputs:
      InputPayload:
        ResourceArn: '{{Remediation.IamRoleArn}}'
      Runtime: python3.11
      Handler: tag_resource
      Script: |-
        %%SCRIPT=common/tag_resource.py%%

  - name: TagFlowLog
    action: 'aws:executeScript'
    onFailure: Continue
    outputs:
      - Name: Output
        Selector: $.Payload
        Type: StringMap
    inputs:
      InputPayload:
        ResourceArn: '{{Remediation.FlowLogArn}}'
      Runtime: python3.11
      Handler: tag_resource
      Script: |-
        %%SCRIPT=common/tag_resource.py%%

    isEnd: true
