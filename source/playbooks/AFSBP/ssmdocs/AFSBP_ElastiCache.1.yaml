---
description: |
  ### Document Name - ASR-AFSBP_1.0.0_ElastiCache.1

  ## What does this document do?
  This document triggers the ElastiCache.1 remediation runbook.

  ## Input Parameters
  * Finding: (Required) Security Hub finding details JSON
  * AutomationAssumeRole: (Required) The ARN of the role that allows Automation to perform the actions on your behalf.

  ## Output Parameters
  * Remediation.Output

  ## Documentation Links
  * [AWS AFSBP ElastiCache.1](https://docs.aws.amazon.com/securityhub/latest/userguide/elasticache-controls.html#elasticache-1)


schemaVersion: '0.3'
assumeRole: '{{ AutomationAssumeRole }}'
outputs:
  - Remediation.Output
  - ParseInput.AffectedObject
  - GetRemediationDetails.Output
  - GetRemediationDetails.FailureMessage
parameters:
  Finding:
    type: StringMap
    description: The input from the Orchestrator Step function for the ElastiCache.1 finding
  AutomationAssumeRole:
    type: String
    description: (Required) The ARN of the role that allows Automation to perform the actions on your behalf.
    allowedPattern: '^arn:(?:aws|aws-us-gov|aws-cn):iam::\d{12}:role/[\w+=,.@-]+$'
  RemediationRoleName:
    type: String
    default: "%%ROLE=SO0111-EnableElastiCacheBackups%%"
    allowedPattern: '^[\w+=,.@-]+$'
  Rollback:
    type: 'String'
    default: ''
    description: '(Optional) Set to ROLLBACK to execute rollback instead of remediation.'
    allowedValues:
    - ''
    - 'ROLLBACK'
  ExecutionId:
    type: 'String'
    default: ''
    description: '(Optional) Original SSM Automation execution ID for snapshot lookup during rollback.'
    allowedPattern: '^$|^[a-zA-Z0-9-]{1,64}$'
  RemediationConfigBucket:
    type: 'String'
    default: '{{ssm:/Solutions/SO0111/RemediationConfigurationBucket}}'
    description: '(Optional) S3 bucket name for snapshot storage. Resolved from SSM parameter by default.'
    allowedPattern: '^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  SnapshotVersionId:
    type: 'String'
    default: ''
    description: '(Optional) S3 version ID of the snapshot object for tamper-proof reads during rollback.'
    allowedPattern: '^$|^[A-Za-z0-9+/=._-]{1,1024}$'
mainSteps:
  - name: ParseInput
    action: 'aws:executeScript'
    outputs:
      - Name: ResourceARN
        Selector: $.Payload.resource_id
        Type: String
      - Name: FindingId
        Selector: $.Payload.finding_id
        Type: String
      - Name: ProductArn
        Selector: $.Payload.product_arn
        Type: String
      - Name: AffectedObject
        Selector: $.Payload.object
        Type: StringMap
      - Name: RemediationRegion
        Selector: $.Payload.resource_region
        Type: String
      - Name: RemediationAccount
        Selector: $.Payload.account_id
        Type: String
      - Name: SecHubInputParams
        Selector: $.Payload.input_params
        Type: StringMap
    inputs:
      InputPayload:
        Finding: '{{Finding}}'
        parse_id_pattern: ''
        expected_control_id:
          - 'ElastiCache.1'
      Runtime: python3.11
      Handler: parse_event
      Script: |-
        %%SCRIPT=common/parse_input.py%%
    isEnd: false

  - name: GetInputParams
    action: 'aws:executeScript'
    outputs:
      - Name: SnapshotRetentionPeriod
        Selector: $.Payload.snapshotRetentionPeriod
        Type: Integer
    inputs:
      InputPayload:
        SecHubInputParams: '{{ParseInput.SecHubInputParams}}'
        DefaultParams: {
          "snapshotRetentionPeriod": 1,
        }
        expected_control_id: [ 'ElastiCache.1' ]
      Runtime: python3.11
      Handler: get_input_params
      Script: |-
        %%SCRIPT=common/get_input_params.py%%

  - name: Remediation
    action: 'aws:executeAutomation'
    onFailure: 'step:GetRemediationDetails'
    isEnd: false
    inputs:
      DocumentName: ASR-EnableElastiCacheBackups
      TargetLocations:
        - Accounts: [ '{{ParseInput.RemediationAccount}}' ]
          Regions: [ '{{ParseInput.RemediationRegion}}' ]
          ExecutionRoleName: '{{ RemediationRoleName }}'
      RuntimeParameters:
        AutomationAssumeRole: 'arn:{{global:AWS_PARTITION}}:iam::{{global:ACCOUNT_ID}}:role/{{RemediationRoleName}}'
        ResourceARN: '{{ParseInput.ResourceARN}}'
        SnapshotRetentionPeriod: '{{GetInputParams.SnapshotRetentionPeriod}}'
        ControlExecutionId: '{{automation:EXECUTION_ID}}'
        Rollback: '{{Rollback}}'
        ExecutionId: '{{ExecutionId}}'
        RemediationConfigBucket: '{{RemediationConfigBucket}}'
        SnapshotVersionId: '{{SnapshotVersionId}}'

  - name: CheckRollback
    action: 'aws:branch'
    description: >-
      Route the rollback path past UpdateFinding. The Orchestrator posts the authoritative rollback note
      (UpdatedBy 'ASR-Rollback') and resets the finding to NEW, so the remediation-worded note and
      RESOLVED status below would mislabel a rolled-back finding.
    inputs:
      Choices:
        - NextStep: GetRemediationDetails
          Variable: '{{Rollback}}'
          StringEquals: 'ROLLBACK'
      Default: UpdateFinding

  - name: UpdateFinding
    action: 'aws:executeAwsApi'
    inputs:
      Service: securityhub
      Api: BatchUpdateFindings
      FindingIdentifiers:
        - Id: '{{ParseInput.FindingId}}'
          ProductArn: '{{ParseInput.ProductArn}}'
      Note:
        Text: 'Automatic backups enabled for cluster {{ParseInput.ResourceARN}}'
        UpdatedBy: 'ASR-AFSBP_1.0.0_ElastiCache.1'
      Workflow:
        Status: RESOLVED
    description: Update finding
    isEnd: false

  - name: GetRemediationDetails
    action: 'aws:executeScript'
    description: >-
      Query the child remediation execution for its outputs (snapshotStored, snapshotVersionId,
      rollbackDescription) and failure message so the Orchestrator can determine rollback
      availability. Terminal step on both the remediation and rollback paths.
    inputs:
      InputPayload:
        execution_id: '{{Remediation.ExecutionId}}'
        target_region: '{{ParseInput.RemediationRegion}}'
      Runtime: python3.11
      Handler: get_remediation_details
      Script: |-
        %%SCRIPT=common/get_remediation_details.py%%
    outputs:
      - Name: Output
        Selector: $.Payload.outputs
        Type: String
      - Name: FailureMessage
        Selector: $.Payload.failure_message
        Type: String
    isEnd: true
