#
# Invalid fixture for hardcoded-secret in its UNQUOTED form. A bare scalar is how
# YAML is normally written, so this is the shape an author reaches for first — and
# a rule that only looked inside quotes let exactly this past.
schemaVersion: "0.3"
description: Assigns a literal password as a bare YAML scalar.
assumeRole: "{{ AutomationAssumeRole }}"
parameters:
  AutomationAssumeRole:
    type: String
    description: IAM role for automation execution
  DbInstanceId:
    type: String
    description: The database instance to modify.
mainSteps:
  - name: RotateCredential
    action: aws:executeAwsApi
    timeoutSeconds: 600
    inputs:
      Service: rds
      Api: ModifyDBInstance
      DBInstanceIdentifier: "{{ DbInstanceId }}"
      MasterUserPassword: hunter2
  - name: VerifyInstance
    action: aws:assertAwsResourceProperty
    timeoutSeconds: 600
    inputs:
      Service: rds
      Api: DescribeDBInstances
      PropertySelector: "$.DBInstances[0].DBInstanceStatus"
      DesiredValues:
        - available
