#
# Valid fixture for hardcoded-secret handling. Password-policy keys and literal
# policy values are configuration, not credentials, so this must pass strict
# validation.
schemaVersion: "0.3"
description: |
  ### Document name - ASR-Custom-IAM.7
assumeRole: "{{ AutomationAssumeRole }}"
parameters:
  AutomationAssumeRole:
    type: String
    description: (Required) The ARN of the role that allows Automation to perform the actions on your behalf.
  Finding:
    type: StringMap
    description: (Required) The ASFF finding, passed by the ASR Orchestrator.
  AllowUsersToChangePassword:
    type: String
    description: (Optional) Whether users may change their own password.
    default: "True"
  MinimumPasswordLength:
    type: String
    description: (Optional) Minimum length for an IAM user password.
    default: "14"
mainSteps:
  - name: SetPasswordPolicy
    action: aws:executeAwsApi
    timeoutSeconds: 600
    inputs:
      Service: iam
      Api: UpdateAccountPasswordPolicy
      AllowUsersToChangePassword: "True"
      MinimumPasswordLength: 14
      RequireUppercaseCharacters: true
      RequireLowercaseCharacters: true
      RequireNumbers: true
      RequireSymbols: true

  - name: VerifyPasswordPolicy
    action: aws:assertAwsResourceProperty
    timeoutSeconds: 600
    isEnd: true
    inputs:
      Service: iam
      Api: GetAccountPasswordPolicy
      PropertySelector: $.PasswordPolicy.AllowUsersToChangePassword
      DesiredValues:
        - "True"
